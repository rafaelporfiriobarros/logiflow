services:

  postgres:
    image: postgres:17
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}

    ports:
      - "127.0.0.1:5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile

    restart: unless-stopped

    environment:
      APP_NAME: ${APP_NAME}
      APP_VERSION: ${APP_VERSION}
      APP_ENV: ${APP_ENV}

      DB_HOST: postgres
      DB_HOSTADDR: ""
      DB_PORT: 5432
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      MONITORING_API_KEY: ${MONITORING_API_KEY:?Configure MONITORING_API_KEY no .env}

    ports:
      - "127.0.0.1:8000:8000"

    depends_on:
      postgres:
        condition: service_healthy

    
  n8n:
    image: n8nio/n8n:latest
    restart: unless-stopped

    ports:
      - "127.0.0.1:5678:5678"

    environment:
      N8N_HOST: localhost
      N8N_PORT: "5678"
      N8N_PROTOCOL: http
      GENERIC_TIMEZONE: ${N8N_TIMEZONE:-America/Sao_Paulo}
      TZ: ${N8N_TIMEZONE:-America/Sao_Paulo}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?Configure N8N_ENCRYPTION_KEY no .env}
      N8N_DIAGNOSTICS_ENABLED: "false"
      MONITORING_API_KEY: ${MONITORING_API_KEY:?Configure MONITORING_API_KEY no .env}

    volumes:
      - n8n_data:/home/node/.n8n

    depends_on:
      api:
        condition: service_started


volumes:
  postgres_data:
  n8n_data: