[project]
name = "logiflow"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "rafaelporfiriobarros", email = "rafaporfirio.barros@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "fastapi>=0.143.1",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.16.0",
    "sqlalchemy>=2.1.4",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
logiflow = "logiflow:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]

[tool.pytest.ini_options]
markers = [
    "postgres: testes de integração com PostgreSQL isolado",
]